# Rebuilds annotations.json (link-preview text for popups.js) whenever pages change.
name: Build link previews

on:
  push:
    branches: [main]
    paths: ["**.html", "scripts/build_annotations.py"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get install -y poppler-utils
      - run: pip install requests beautifulsoup4
      - run: python3 scripts/build_annotations.py
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add annotations.json
          git diff --cached --quiet || (git commit -m "Update link previews" && git push)
